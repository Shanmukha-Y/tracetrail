[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tracetrail"
version = "0.1.0"
description = "Local evidence-based CloudTrail investigation with bounded LangGraph agents"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langchain==1.4.5",
  "langchain-core==1.6.10",
  "langchain-ollama==1.1.0",
  "langgraph==1.2.15",
  "langsmith==0.14.8",
  "ollama==0.6.3",
  "pydantic>=2.12,<3",
]

[project.scripts]
tracetrail = "tracetrail.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
